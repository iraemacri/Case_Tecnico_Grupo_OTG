-- ============================================================
-- SCHEMA - Definicao dos modelos staging
-- Arquivo: schema.yml
-- Descricao: Testes e documentacao dos modelos Bronze
-- ============================================================

version: 2

models:
  - name: stg_players
    description: "Modelo de staging para dados de jogadores"
    columns:
      - name: player_id
        description: "ID unico do jogador"
        tests:
          - unique
          - not_null
      - name: email
        description: "Email normalizado (lowercase)"
        tests:
          - not_null
      - name: city
        description: "Cidade do jogador"
      - name: created_at
        description: "Data de criacao da conta"
        tests:
          - not_null

  - name: stg_sessions
    description: "Modelo de staging para sessoes de acesso"
    columns:
      - name: session_id
        description: "ID unico da sessao"
        tests:
          - unique
          - not_null
      - name: player_id
        description: "ID do jogador"
        tests:
          - not_null
          - relationships:
              to: ref('stg_players')
              field: player_id
      - name: ip
        description: "Endereco IP"
      - name: device
        description: "Dispositivo (android/ios/desktop)"
      - name: session_timestamp
        description: "Timestamp da sessao"
        tests:
          - not_null

  - name: stg_transactions
    description: "Modelo de staging para transacoes financeiras"
    columns:
      - name: transaction_id
        description: "ID unico da transacao"
        tests:
          - unique
          - not_null
      - name: player_id
        description: "ID do jogador"
        tests:
          - not_null
          - relationships:
              to: ref('stg_players')
              field: player_id
      - name: transaction_type
        description: "Tipo da transacao"
        tests:
          - accepted_values:
              values: ['deposit', 'withdraw', 'bet']
      - name: amount
        description: "Valor da transacao"
        tests:
          - not_null
      - name: transaction_timestamp
        description: "Timestamp da transacao"
        tests:
          - not_null

  - name: stg_affiliates
    description: "Modelo de staging para performance de afiliados"
    columns:
      - name: affiliate_id
        description: "ID do afiliado"
        tests:
          - not_null
      - name: player_id
        description: "ID do jogador"
        tests:
          - not_null
          - relationships:
              to: ref('stg_players')
              field: player_id
      - name: country
        description: "Pais do jogador"
      - name: clicks
        description: "Numero de cliques"
        tests:
          - not_null
      - name: registrations
        description: "Numero de registros"
        tests:
          - not_null
      - name: ftd_count
        description: "First Time Deposit"
        tests:
          - not_null
      - name: cpa_value
        description: "Valor do CPA"
        tests:
          - not_null
